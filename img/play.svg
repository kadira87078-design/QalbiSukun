<svg width="30" height="30" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    
    <defs>
        <!-- 🟢 Green Background -->
        <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f3f35"/>
            <stop offset="100%" stop-color="#0f3f35"/>
        </linearGradient>

        <!-- 🟡 Golden Play Icon -->
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D9B369"/>
            <stop offset="100%" stop-color="#D9B369"/>
        </linearGradient>
    </defs>

    <!-- Circle -->
    <circle cx="12" cy="12" r="11" fill="url(#greenGrad)" />

    <!-- Play Icon -->
    <polygon points="9,7 17,12 9,17" fill="url(#goldGrad)" />

</svg>
