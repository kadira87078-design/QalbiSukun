        </linearGradient>
    </defs>

    <!-- Circle -->
    <circle cx="12" cy="12" r="11" fill="url(#greenGrad)" />

    <!-- Pause Bars -->
    <rect x="8" y="7" width="2.5" height="10" rx="1" fill="url(#goldGrad)" />
    <rect x="13.5" y="7" width="2.5" height="10" rx="1" fill="url(#goldGrad)" />

</svg>